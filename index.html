<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recipe Guide</title>
  <meta name="theme-color" content="#1b3a73">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Recipe Guide">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <span class="brand-mark"><img src="img/logo.png" alt="Caribou Coffee" width="40" height="44"></span>
        <div>
          <h1>Recipe Guide</h1>
          <p class="brand-sub" data-i18n="subtitle">دليل تحضير المشروبات</p>
        </div>
        <button id="langBtn" class="pill ghost" type="button" aria-label="Language">EN</button>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M21 21l-4.3-4.3M10.5 18a7.5 7.5 0 110-15 7.5 7.5 0 010 15z"/></svg>
        <input id="q" type="search" autocomplete="off" enterkeyhint="search" placeholder="">
        <button id="clearQ" class="clear" type="button" aria-label="مسح" hidden>×</button>
      </div>
      <nav class="tabs" id="tabs" aria-label="الأقسام"></nav>
    </div>
  </header>

  <main>
    <section class="filters" aria-label="فلاتر">
      <div class="chip-row" id="chips"></div>
      <p class="count" id="count" aria-live="polite"></p>
    </section>
    <div id="list"></div>
  </main>

  <p class="foot-note" id="foot"></p>

  <dialog id="dlg" aria-label="Recipe"></dialog>
  <div id="toast" class="toast" role="status"></div>

  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
